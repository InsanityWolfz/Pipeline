# Builds every pushed branch and publishes it to the gh-pages branch:
# main at the site root, other branches under /branch/<name>/.
# A deleted branch has its folder removed.
name: Pages preview

on:
  push:
    branches-ignore: [gh-pages]
  delete:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish to gh-pages
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" = "main" ]; then target="."; else target="branch/$BRANCH"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin gh-pages; then
            git worktree add site FETCH_HEAD
          else
            git worktree add --orphan -b gh-pages site
          fi
          if [ "$target" = "." ]; then
            find site -mindepth 1 -maxdepth 1 ! -name .git ! -name branch -exec rm -rf {} +
          else
            rm -rf "site/$target"
          fi
          mkdir -p "site/$target"
          cp -r dist/. "site/$target/"
          touch site/.nojekyll
          cd site
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -qm "Deploy $BRANCH @ ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages

  remove:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Remove the branch preview
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          [ -d "branch/$BRANCH" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rq "branch/$BRANCH"
          git commit -qm "Remove preview for $BRANCH"
          git push origin HEAD:gh-pages
